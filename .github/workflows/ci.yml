# CI for every pull request and for main (plan §3.1, §7.5). The required check is `ci`,
# which passes only when every job below passed. Images are pinned by @sha256 digest and
# actions by commit SHA; Renovate keeps both current (renovate.json).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    # Everything `scripts/verify.sh all` runs: lint, typecheck, unit, build, the whole E2E
    # suite in desktop-chromium, mobile-chromium and mobile-webkit, the visual regression (from
    # M00b), and every scripts/verify.d/*.sh (from M00b with the JavaScript budget and Lighthouse
    # CI), against PostgreSQL 18 + PostGIS 3.6 and Mailpit.
    name: verify (Node 26, PostgreSQL 18, Playwright)
    runs-on: ubuntu-24.04
    # 30 minutes stopped the job in checks:M03 after the whole suite had passed (M04, run 39198539517).
    timeout-minutes: 60
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Not wingchunroots_test: the image loads postgis and postgis_topology into
          # POSTGRES_DB. The test database is created empty from template0 by the step
          # below, with the same SQL as Docker Compose, exactly as in the cloud session.
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mailpit:
        # The same image as docker-compose.yml (from M01b): the worker sends e-mail over SMTP
        # (1025) and e2e/helpers/mailbox.ts reads it back through the Mailpit API (8025).
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
          MP_MAX_MESSAGES: "5000"
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # E-mail goes to the Mailpit service above (SMTP_URL and MAILPIT_URL keep their defaults,
      # smtp://127.0.0.1:1025 and http://127.0.0.1:8025).
      MAIL_TRANSPORT: smtp
      # Throwaway credentials of the postgres service container above; not a secret.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/wingchunroots_test
      # Throwaway passwords of the database roles (from M01); scripts/verify.sh bootstraps the
      # roles with scripts/db-bootstrap.sh before the database steps.
      DB_MIGRATOR_PASSWORD: migrator-ci
      DB_APP_RW_PASSWORD: app-rw-ci
      DB_APP_PUBLIC_RO_PASSWORD: app-public-ro-ci
      # M10a: evidence goes to the SeaweedFS started below, through the ObjectStore S3 driver
      # (src/server/storage); the contract test also runs against it. Throwaway identity of that
      # container; not a secret.
      S3_ENDPOINT: http://127.0.0.1:8333
      S3_ACCESS_KEY_ID: s3-key-ci
      S3_SECRET_ACCESS_KEY: s3-secret-ci
      S3_BUCKET_EVIDENCE: wcr-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm (exact version from packageManager, no Corepack)
        run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # M04: docs/api/openapi.json matches the router (plan §6.8); fails fast, before the long run.
      - run: pnpm api:openapi --check
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Install the PostgreSQL client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Create the test database (same SQL as Docker Compose)
        run: psql "postgres://postgres:postgres@127.0.0.1:5432/postgres" -X -v ON_ERROR_STOP=1 -f docker/postgres/20-create-test-database.sql
      - name: Start SeaweedFS (same image and command as docker-compose.yml, from M10a)
        # A step, not a service container: a service cannot take the `mini` command. Private
        # buckets only; the evidence bucket is created on start-up (S3_BUCKET).
        run: |
          docker run -d --name seaweedfs -p 127.0.0.1:8333:8333 \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            -e S3_BUCKET="$S3_BUCKET_EVIDENCE,wcr-media" \
            chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d \
            mini -dir=/data -webdav=false -admin.ui=false -s3.port.iceberg=0 -s3.port.lance=0
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8333/healthz >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs --tail 80 seaweedfs
          exit 1
      - name: Generate the throwaway account settings (from M02)
        # Random per run and never in the repository: the Better Auth secret, the ip_hmac key, the
        # mail seal key and the test-only credentials of the seeded demo accounts (.env.example).
        run: |
          random_hex() { od -An -N"$1" -tx1 /dev/urandom | tr -d ' \n'; }
          auth_secret="$(random_hex 32)"
          ip_key="$(random_hex 32)"
          seal_key="$(random_hex 32)"
          password="wcr-$(random_hex 12)"
          totp_secret="$(random_hex 20)"
          for value in "$auth_secret" "$ip_key" "$seal_key" "$password" "$totp_secret"; do echo "::add-mask::$value"; done
          {
            echo "BETTER_AUTH_SECRET=$auth_secret"
            echo "IP_HMAC_KEY=$ip_key"
            echo "MAIL_SEAL_KEY=$seal_key"
            echo "E2E_PASSWORD=$password"
            echo "E2E_TOTP_SECRET=$totp_secret"
          } >> "$GITHUB_ENV"
      - name: scripts/verify.sh all
        env:
          # M12: the backup and the restore drill of checks:M12 run pg_dump and pg_restore inside the
          # PostgreSQL 18 service container (the runner's client is older; scripts/lib/pg-run.sh).
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: scripts/verify.sh all
      # verify.sh shows only the last 80 lines of a failed step; Playwright's numbered failure
      # reports come earlier. The artifact has the whole log, but the reports also belong here.
      - name: Print the end-to-end failure reports
        if: failure()
        run: |
          [ -f .verify/all.log ] || exit 0
          awk '/^  1\) \[/ { p = 1 } p && /^  [0-9]+ (failed|flaky)$/ { exit } p' .verify/all.log | grep -v -e '^ *attachment #' -e 'show-trace' -e '^ *Usage:$' | head -n 1500
      - name: Summarize the traces of the failed end-to-end tests
        # mobile-webkit runs only here, and the artifact cannot always be downloaded: for each failed
        # test's trace.zip, WebKit first, its page errors, console errors and warnings, action
        # timeline and requests (path, status, timing), at most 300 lines a test and 2400 in all.
        # Never bodies, headers, cookies, query strings, typed values or snapshots, and the values of
        # this job's secret settings become *** (scripts/trace-summary.mjs).
        if: failure()
        run: node scripts/trace-summary.mjs test-results
      - name: Print the visual regression screenshots that match no baseline
        # The visual project (e2e/visual.spec.ts, M00b) runs only here. When a screenshot has no
        # baseline or differs from it, this prints it as base64 so it can be reviewed and accepted
        # from the job log too (scripts/visual-baselines.sh accept; docs/guides/admin-guide.bg.md).
        if: failure()
        run: scripts/visual-baselines.sh print
      - name: Upload the verify log and Playwright results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-log
          path: |
            .verify/
            test-results/
            playwright-report/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14


  security:
    name: security (gitleaks, pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (whole history)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose --no-banner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm (exact version from packageManager, no Corepack)
        run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
      - name: pnpm audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level=high

  image:
    # M12 (docs/operations/local-run.md): the application image (Dockerfile) built and started with
    # the Compose profile `app` (PostgreSQL 18 + PostGIS, Mailpit, SeaweedFS, db-bootstrap, migrate,
    # web, worker), exactly as on the owner's machine; then /healthz and the @smoke tests against the
    # container. Throwaway local values from scripts/init-env.sh; no secret, nothing is published.
    name: image (Dockerfile, Compose profile app)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm (exact version from packageManager, no Corepack)
        run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
      - name: Install dependencies (the host seeds the demo data and runs Playwright)
        run: pnpm install --frozen-lockfile
      - name: Local settings (scripts/init-env.sh), with the address this job opens
        run: |
          scripts/init-env.sh
          sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:3000|' .env
          for name in POSTGRES_PASSWORD DB_MIGRATOR_PASSWORD DB_APP_RW_PASSWORD DB_APP_PUBLIC_RO_PASSWORD \
            S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY BETTER_AUTH_SECRET IP_HMAC_KEY MAIL_SEAL_KEY E2E_PASSWORD E2E_TOTP_SECRET; do
            value="$(sed -n "s/^${name}=//p" .env)"
            [ -n "$value" ] && echo "::add-mask::$value"
          done
      - name: scripts/check-env.sh compose
        run: scripts/check-env.sh compose
      - name: Build the image and start the profile app
        run: docker compose --profile app up -d --build
      - name: Wait for /healthz
        run: |
          for attempt in $(seq 1 90); do
            if [ "$(curl -fsS http://127.0.0.1:3000/healthz 2>/dev/null)" = '{"ok":true}' ]; then
              docker compose --profile app ps -a
              exit 0
            fi
            sleep 2
          done
          docker compose --profile app ps -a
          docker compose --profile app logs --no-color --tail 120 db-bootstrap migrate web worker
          exit 1
      - name: /healthz answers only {"ok":true}, and the processes do not run as root
        run: |
          body="$(curl -fsS -D headers.txt http://127.0.0.1:3000/healthz)"
          test "$body" = '{"ok":true}'
          grep -qi '^cache-control: no-store' headers.txt
          for service in web worker; do
            uid="$(docker compose --profile app exec -T "$service" id -u)"
            echo "$service runs as uid $uid"
            test "$uid" != 0
          done
          test "$(docker compose --profile app ps -a --format '{{.ExitCode}}' migrate)" = 0
      - name: Demo data from the host (pnpm db:seed into the Compose database)
        run: pnpm db:seed
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: The @smoke tests against the container
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: pnpm e2e --grep '@smoke\b' --project desktop-chromium --project mobile-chromium
      - name: Logs of the profile app
        if: failure()
        run: docker compose --profile app logs --no-color --tail 300 db-bootstrap migrate web worker
      - name: Upload the Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop the profile app
        if: always()
        run: docker compose --profile app down -v --remove-orphans

  ci:
    # The single required status check for main (plan §7.4).
    name: ci
    if: always()
    needs: [verify, security, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          VERIFY: ${{ needs.verify.result }}
          SECURITY: ${{ needs.security.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          echo "verify=$VERIFY security=$SECURITY image=$IMAGE"
          test "$VERIFY" = success && test "$SECURITY" = success && test "$IMAGE" = success
