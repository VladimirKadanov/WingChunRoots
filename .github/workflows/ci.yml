# CI for every pull request and for main (plan §3.1, §7.5). The required check is `ci`,
# which passes only when every job below passed. Images are pinned by @sha256 digest and
# actions by commit SHA; Renovate keeps both current (renovate.json).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    # Everything `scripts/verify.sh all` runs: lint, typecheck, unit, build, the whole E2E
    # suite in desktop-chromium, mobile-chromium and mobile-webkit, and every
    # scripts/verify.d/*.sh, against PostgreSQL 18 + PostGIS 3.6 and Mailpit.
    name: verify (Node 24, PostgreSQL 18, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Not wingchunroots_test: the image loads postgis and postgis_topology into
          # POSTGRES_DB. The test database is created empty from template0 by the step
          # below, with the same SQL as Docker Compose, exactly as in the cloud session.
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      mailpit:
        # The same image as docker-compose.yml (from M01b): the worker sends e-mail over SMTP
        # (1025) and e2e/helpers/mailbox.ts reads it back through the Mailpit API (8025).
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
          MP_MAX_MESSAGES: "5000"
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      # E-mail goes to the Mailpit service above (SMTP_URL and MAILPIT_URL keep their defaults,
      # smtp://127.0.0.1:1025 and http://127.0.0.1:8025).
      MAIL_TRANSPORT: smtp
      # Throwaway credentials of the postgres service container above; not a secret.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/wingchunroots_test
      # Throwaway passwords of the database roles (from M01); scripts/verify.sh bootstraps the
      # roles with scripts/db-bootstrap.sh before the database steps.
      DB_MIGRATOR_PASSWORD: migrator-ci
      DB_APP_RW_PASSWORD: app-rw-ci
      DB_APP_PUBLIC_RO_PASSWORD: app-public-ro-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm (exact version from packageManager, no Corepack)
        run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Install the PostgreSQL client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Create the test database (same SQL as Docker Compose)
        run: psql "postgres://postgres:postgres@127.0.0.1:5432/postgres" -X -v ON_ERROR_STOP=1 -f docker/postgres/20-create-test-database.sql
      - name: scripts/verify.sh all
        run: scripts/verify.sh all
      - name: Upload the verify log and Playwright results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-log
          path: |
            .verify/
            test-results/
            playwright-report/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  node22:
    # Cloud sessions run Node 22 (engines: >=22.12), so lint, typecheck and unit tests run
    # on it too (plan §3.2).
    name: node22 (lint, typecheck, unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pnpm (exact version from packageManager, no Corepack)
        run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  security:
    name: security (gitleaks, pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (whole history)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose --no-banner
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm (exact version from packageManager, no Corepack)
        run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
      - name: pnpm audit (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level=high

  ci:
    # The single required status check for main (plan §7.4).
    name: ci
    if: always()
    needs: [verify, node22, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          VERIFY: ${{ needs.verify.result }}
          NODE22: ${{ needs.node22.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          echo "verify=$VERIFY node22=$NODE22 security=$SECURITY"
          test "$VERIFY" = success && test "$NODE22" = success && test "$SECURITY" = success
