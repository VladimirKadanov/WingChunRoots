var TITLES={explore:'Explore',lineage:'Lineage',schools:'Schools',me:'Me',profile:'Profile'};
var cur={view:null,arg:null},lastHash='',profFrom='explore',restoring=false;
var HS={ok:true,stack:[],i:-1};
function snap(){
return{wcr:1,v:cur.view,a:cur.view==='profile'?cur.arg:null,sel:EX.sel,sh:EX.sheet?EX.sheet.state:'peek',sc:SC.sel,ssh:SC.sheet?SC.sheet.state:'peek',m:!$('#modal').hidden};
}
function same(a,b){return!!a&&!!b&&['v','a','sel','sh','sc','ssh','m'].every(function(k){return a[k]===b[k];});}
function urlFor(s){var x=s.v==='lineage'?s.sel:s.v==='schools'?s.sc:s.a;return'#'+s.v+(x?'-'+x:'');}
function record(push){
if(restoring||!cur.view)return;
var s=snap(),h=urlFor(s);
if(HS.i>=0&&same(HS.stack[HS.i],s))return;
if(push&&HS.i>=0){HS.stack=HS.stack.slice(0,HS.i+1);HS.i++;}else HS.i=Math.max(0,HS.i);
HS.stack[HS.i]=s;s.i=HS.i;
try{history[push&&HS.i>0?'pushState':'replaceState'](s,'',h);}catch(e){HS.ok=false;}
lastHash=h;paintBack();
}
function unwind(){
if(restoring)return;
if(HS.ok&&HS.i>0&&same(HS.stack[HS.i-1],snap())){try{history.back();return;}catch(e){}}
record(false);
}
function restore(s){
restoring=true;
var moved=false;
try{
if(!s.m)closeModal('pop');
var target=s.v==='lineage'?s.sel:s.v==='schools'?s.sc:s.a;
moved=s.v!==cur.view||(s.v==='profile'&&s.a!==cur.arg);
if(moved)go(s.v,target,{restore:true});
if(s.v==='lineage'){
if(s.sel!==EX.sel){if(s.sel)selectPerson(s.sel,{from:'restore'});else clearSelection('pop');}
if(isPhone()&&EX.sheet.state!==s.sh)EX.sheet.set(s.sh);
}
if(s.v==='schools'){
if(s.sc!==SC.sel){if(s.sc)selectSchool(s.sc,{from:'restore'});else{SC.sel=null;renderSchoolList();mapRender();}}
if(isPhone()&&SC.sheet.state!==s.ssh)SC.sheet.set(s.ssh);
}
}finally{restoring=false;}
lastHash=location.hash;paintBack();setTitle();
var ae=document.activeElement;
if(moved||!ae||ae===document.body||!ae.getClientRects().length)focusMain();
if(s.m&&$('#modal').hidden)record(false);
}
window.addEventListener('popstate',function(e){
var s=e.state;
if(s&&s.wcr){HS.i=s.i;HS.stack[s.i]=s;restore(s);return;}
var r=parseHash();go(r.view,r.arg,{replace:true,focusMain:true});
});
window.addEventListener('hashchange',function(){
if(location.hash===lastHash)return;
var r=parseHash();go(r.view,r.arg,{replace:true,focusMain:true});
});
function goBack(){
if(HS.ok&&HS.i>0){try{history.back();return;}catch(e){}}
go(cur.view==='profile'?profFrom:'explore',null,{focusMain:true});
}
function backLabel(){
var p=HS.ok&&HS.i>0?HS.stack[HS.i-1]:null;
if(!p)return TITLES[profFrom];
if(p.v==='profile'&&P(p.a))return P(p.a).name.split(' ')[0];
return p.v==='lineage'&&p.sel?'Map':TITLES[p.v];
}
function paintBack(){
var l=backLabel();
$('#back-label').textContent=l;
$$('.bk-l').forEach(function(e){e.textContent='Back to '+l;});
$('#back-btn').setAttribute('aria-label','Back to '+l);
}
function setTitle(){
var t=cur.view==='profile'?(P(cur.arg)?P(cur.arg).name+' · Profile':'Station not found')
:cur.view==='lineage'?(EX.sel?P(EX.sel).name+' · Lineage map':'Lineage map')
:cur.view==='schools'?(SC.sel?IX.schools[SC.sel].name+' · Schools':'Schools near '+ME.location.area)
:cur.view==='me'?'Sifu dashboard':'Explore lineages';
document.title=t+' · WingChunRoots';
}
function toolsFor(view,zoom,v){
var ph=isPhone(),free=view.clientHeight-v;
zoom.style.bottom=(ph?v+12:16)+'px';
view.classList.toggle('tools-off',ph&&free<132);
zoom.classList.toggle('tight',ph&&free<300);
}
function sheetUser(next,prev){
if(cur.view==='lineage'&&EX.sel&&next==='half')EX.pz.animateTo(personView(EX.sel,'half'),380);
if(prev==='peek')record(true);else if(next==='peek')unwind();else record(false);
}
function go(view,arg,opts){
opts=opts||{};
if(view==='profile'&&cur.view&&cur.view!=='profile')profFrom=cur.view;
else if(view==='profile'&&opts.restore){profFrom='explore';for(var j=HS.i-1;j>=0;j--)if(HS.stack[j]&&HS.stack[j].v!=='profile'){profFrom=HS.stack[j].v;break;}}
if(cur.view==='lineage'&&view!=='lineage')rideStop();
cur={view:view,arg:arg};
['explore','lineage','schools','me','profile'].forEach(function(v){$('#view-'+v).hidden=v!==view;});
var tabView=view==='profile'?profFrom:view;
$$('.tab').forEach(function(t){if(t.dataset.tab===tabView)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');});
var back=$('#back-btn'),brand=$('#brand');
back.hidden=!(view==='profile'&&isPhone());
brand.hidden=view==='profile'&&isPhone();
brand.classList.toggle('compact',view!=='explore');
$('#page-title').textContent=view==='explore'||view==='profile'?'':TITLES[view];
if(view==='explore')requestAnimationFrame(function(){renderStrip();renderMiniMap();});
if(view==='lineage'){
if(!EX.built)buildExplorer();
exInit();
if(!EX.sheet)EX.sheet=Sheet($('#ex-sheet'),{name:'Details',initial:'peek',onUser:sheetUser,onChange:function(v){toolsFor($('#view-lineage'),$('#ex-zoom'),v);paintCap();}});
if(!EX.sel)renderGuidePanel();
EX.sheet.set(EX.sel?EX.sheet.state:'peek',true);
if(!EX.firstShown){EX.firstShown=true;exFirstView();}
else exApply(EX.pz.s);
if(arg&&P(arg)&&!(opts.restore&&arg===EX.sel))selectPerson(arg,{from:opts.restore?'restore':'nav'});
}
if(view==='schools'){
mapInit();
if(!SC.sheet)SC.sheet=Sheet($('#sc-sheet'),{name:'Schools list',initial:'peek',onUser:sheetUser,onChange:function(v){toolsFor($('#view-schools'),$('#map-zoom'),v);}});
renderSchoolList();
SC.sheet.set(SC.sheet.state,true);
if(!SC.firstShown){SC.firstShown=true;mapFit(true);}
else mapRender();
if(arg&&IX.schools[arg]&&!(opts.restore&&arg===SC.sel))selectSchool(arg,{from:opts.restore?'restore':'nav'});
}
if(view==='me')renderMe();
if(view==='profile')renderProfile(arg);
if(!opts.restore)record(!opts.replace);
paintBack();setTitle();
if(opts.focusMain)focusMain();
}
function parseHash(){
var h=(location.hash||'').replace(/^#/,'');
if(!h)return{view:'explore'};
var m=h.match(/^(explore|lineage|schools|me|profile)(?:-(.+))?$/);
if(!m)return{view:'explore'};
return{view:m[1],arg:m[2]||null};
}
function currentTheme(){
var t=document.documentElement.getAttribute('data-theme');
if(t)return t;
return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}
function paintThemeBtn(){
var dark=currentTheme()==='dark',b=$('#theme-btn');
b.innerHTML=icon(dark?'sun':'moon')+'<span>'+(dark?'Day service':'Night service')+'</span>';
b.setAttribute('aria-label',dark?'Switch to day service (light theme)':'Switch to night service (dark theme)');
}
function toggleTheme(){
var next=currentTheme()==='dark'?'light':'dark';
document.documentElement.setAttribute('data-theme',next);
try{localStorage.setItem('wcr-transit-theme',next);}catch(e){}
paintThemeBtn();
}
function meFocusNext(afterId,kb){
var i=MS.reqs.findIndex(function(r){return r.id===afterId;});
var pend=MS.reqs.filter(function(r,j){return r.status==='pending'&&j>=i;}).concat(MS.reqs.filter(function(r){return r.status==='pending';}));
var el=pend.length?$('#req-'+pend[0].id+' [data-action="req-approve"]'):$('#ap');
if(el)el.focus({preventScroll:!kb});
}
document.addEventListener('click',function(e){
var t=e.target.closest('[data-tab], [data-tab-link], [data-action], [data-profile], [data-focus], [data-school]');
if(!t)return;
if(t.closest('#ex-canvas')||t.closest('#map-canvas'))return;
var kb=e.detail===0,inM;
if(t.hasAttribute('data-tab-link')){e.preventDefault();inM=closeModal('nav');go(t.dataset.tabLink,null,{replace:inM});return;}
if(t.dataset.tab){inM=closeModal('nav');go(t.dataset.tab,null,{replace:inM});return;}
if(t.dataset.profile){inM=closeModal('nav');go('profile',t.dataset.profile,{replace:inM,focusMain:true});return;}
if(t.dataset.focus){
var inSheet=!!t.closest('#ex-sheet');inM=closeModal('nav');
if(cur.view!=='lineage'){go('lineage',t.dataset.focus,{replace:inM,focusMain:true});return;}
selectPerson(t.dataset.focus,{from:'link'});
if(kb){if(EX.mode==='list')focusSel('#ex-outline h3');else if(inSheet){var h=$('#ex-sheet .pp-name');h.setAttribute('tabindex','-1');h.focus();}else focusMain();}
return;
}
if(t.dataset.school&&!t.dataset.action){inM=closeModal('nav');go('schools',t.dataset.school,{replace:inM,focusMain:true});return;}
var a=t.dataset.action,id=t.dataset.id,ph=isPhone();
switch(a){
case'theme':toggleTheme();break;
case'back':goBack();break;
case'close-modal':closeModal();break;
case'undo':if(TOAST.undo){var u=TOAST.undo;TOAST.ret=null;toastHide();u();}break;
case'ex-mode':setExMode(t.dataset.mode);break;
case'ex-clear':clearSelection();if(kb)focusSel('#ex-st [data-person="'+EX.rov+'"]');break;
case'ex-ride':{
if(!EX.sel)break;
if(ph&&EX.sheet.state!=='peek'){EX.sheet.set('peek');unwind();}
var f=frame(EX.sel,ph?'peek':null);
if(f.fits){EX.pz.animateTo(f);playRoute(EX.sel,{delay:200});}else ride(EX.sel,ph?'peek':null,false,true);
break;
}
case'ex-cap':
if(EX.capKey.indexOf('root')===0)ride(EX.sel,ph?EX.sheet.state:null,false,true);
else EX.pz.animateTo(personView(EX.sel,ph?EX.sheet.state:null),600);
break;
case'ex-zoom':{
var a2=exArea();rideStop();
if(t.dataset.z==='fit')exFit();else EX.pz.zoomAt((a2.left+a2.right)/2,(a2.top+a2.bottom)/2,EX.pz.s.k*(t.dataset.z==='in'?1.35:1/1.35));
break;
}
case'map-zoom':{
var m=mapArea();
if(t.dataset.z==='me')mapFit();else SC.pz.zoomAt(m.w/2,(m.top+m.bottom)/2,SC.pz.s.k*(t.dataset.z==='in'?1.6:1/1.6));
break;
}
case'sc-km':SC.km=t.dataset.km?+t.dataset.km:null;renderSchoolList();scListTop();mapFit();record(false);focusSel('[data-action="sc-km"][aria-pressed="true"]');break;
case'sc-lin':SC.lin=t.dataset.lin;renderSchoolList();scListTop();mapFit();record(false);focusSel('[data-action="sc-lin"][aria-pressed="true"]');break;
case'sc-select':selectSchool(id,{kb:kb});break;
case'trial':openTrial(id);break;
case'req-link':openRequestLink(id);break;
case'pub-preview':PROF.publicPreview=!PROF.publicPreview;renderProfile(cur.arg);paintBack();focusSel('[data-action="pub-preview"]');break;
case'req-approve':{
var r=MS.reqs.filter(function(x){return x.id===id;})[0],self='#req-'+id+' [data-action="req-approve"]';
if(MS.used>=MS.limit){r.held=true;renderMe();openPlan(r,self);break;}
MS.used++;r.status='approved';MS.pop=MS.used-1;MS.roster.push({name:r.studentName});renderMe();
if(!kb)meFocusNext(id,false);
toast('Approved. '+r.studentName+' now shows on your line.',function(){MS.used--;r.status='pending';MS.roster.pop();renderMe();focusSel(self);},{kb:kb,ret:function(){meFocusNext(id,true);}});
break;
}
case'req-decline':MS.confirm=id;renderMe();focusSel('#req-'+id+' [data-action="req-keep"]');break;
case'req-keep':MS.confirm=null;renderMe();focusSel('#req-'+id+' [data-action="req-decline"]');break;
case'req-decline-yes':{
var r2=MS.reqs.filter(function(x){return x.id===id;})[0];
r2.status='declined';MS.confirm=null;renderMe();
if(!kb)meFocusNext(id,false);
toast('Declined '+r2.studentName+'’s request.',function(){r2.status='pending';renderMe();focusSel('#req-'+id+' [data-action="req-decline"]');},{kb:kb,ret:function(){meFocusNext(id,true);}});
break;
}
case'plan':openPlan(null);break;
case'plan-upgrade':{var n=$('#plan-note');n.hidden=false;n.className='note';n.setAttribute('role','status');n.innerHTML='<b>No payment in this prototype.</b> In the product you would see the price again and confirm before anything is charged. You can cancel any time and keep everyone you approved.';try{n.scrollIntoView({block:'center',behavior:RM.matches?'auto':'smooth'});}catch(x){}break;}
case'retry':{
MS.activity='loading';renderMe();focusSel('#la');
setTimeout(function(){MS.activity='ok';if(cur.view==='me'){var had=document.activeElement&&document.activeElement.id==='la';renderMe();if(had)focusSel('#la');}},1100);
break;
}
}
});
var resizeT=0;
window.addEventListener('resize',function(){
clearTimeout(resizeT);
resizeT=setTimeout(function(){
if(EX.sheet)EX.sheet.refresh();
if(SC.sheet)SC.sheet.refresh();
if(cur.view==='explore'){renderStrip();renderMiniMap();}
if(cur.view==='lineage'&&EX.pz)exApply(EX.pz.s);
if(cur.view==='schools'&&SC.pz)mapRender();
$('#back-btn').hidden=!(cur.view==='profile'&&isPhone());
$('#brand').hidden=cur.view==='profile'&&isPhone();
if(cur.view==='profile'&&!$('#view-profile').contains(document.activeElement)){renderProfile(cur.arg);paintBack();}
},160);
});
document.addEventListener('keydown',function(e){
if(e.key==='Escape'&&cur.view==='lineage'&&EX.sel&&$('#modal').hidden&&!(e.target.closest&&e.target.closest('input')))clearSelection();
});
try{var saved=localStorage.getItem('wcr-transit-theme');if(saved==='dark'||saved==='light')document.documentElement.setAttribute('data-theme',saved);}catch(e){}
paintThemeBtn();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintThemeBtn);}catch(e){}
buildExplorer();
renderExplore();
try{if(history.state&&history.state.wcr)HS.i=history.state.i||0;}catch(e){}
var start=parseHash();
go(start.view,start.arg,{replace:true});
})();
