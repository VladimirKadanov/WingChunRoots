function same(a,b){return a&&b&&a.name===b.name&&(a.id||null)===(b.id||null);}
var api={
parse:function(hash){
var m=String(hash||'').replace(/^#\/?/,'').split('/'),name=m[0],id=m[1]?decodeURIComponent(m[1]):null;
if(SCREENS.indexOf(name)<0||(name==='profile'&&!PX[id]))return{name:'explore',id:null};

return{name:name,id:id};
},
init:function(s){stack=[s];idx=0;h('replaceState',s);},
push:function(s,replaceTop){if(same(stack[idx],s)){api.replace(s);return;}stack.length=idx+1;stack.push(s);idx++;h(replaceTop?'replaceState':'pushState',s);},
replace:function(s){stack[idx]=s;h('replaceState',s);},
layer:function(id){h('pushState',stack[idx],id);},
unlayer:function(){if(ok){skip++;history.back();}},
prev:function(){return idx>0?stack[idx-1]:null;},
back:function(){if(idx<=0)return false;if(ok)history.back();else{idx--;route(stack[idx]);}return true;},
pop:function(e){
if(skip){skip--;return;}
if(Layer.pop())return;
var k=e.state&&e.state.k;
if(k!=null&&stack[k])idx=k;
else{var s=api.parse(location.hash);stack.length=idx+1;stack.push(s);idx++;}
route(stack[idx]);
}
};
return api;
})();
