# Local services for development and tests (plan §3.1, §7.6).
#
#   scripts/init-env.sh          # once: writes .env with local-only values
#   docker compose up -d --wait  # PostgreSQL 18 + PostGIS 3.6, Mailpit, SeaweedFS
#
# Windows: keep the repository inside the WSL2 filesystem (for example ~/src/wingchunroots)
# and run these commands from the WSL2 shell with Docker Desktop's WSL2 backend. Data lives
# in named volumes, never in bind mounts under C:\ (permissions and speed). See README.md.
#
# Every image is pinned by @sha256 digest; Renovate keeps the digests current (renovate.json).
#
# M12, the production-like local run (profile "app"; docs/operations/local-run.md):
#
#   scripts/check-env.sh compose         # the settings below are set and none is an example
#   docker compose --profile app up --build
#
# builds the application image (Dockerfile) and starts, after the services above, db-bootstrap
# (database roles, once), migrate (migrations as migrator, then exits), web (one replica, plan
# §7.6) on http://localhost:3000 and worker. The app uses the database `wingchunroots`, the same as
# `pnpm dev`; the demo data comes from the host (`pnpm db:seed`). Every port listens on 127.0.0.1.
name: wingchunroots

# The application image and its settings, shared by migrate, web and worker.
x-app: &app
  # No `image:` name: every image in this file is pinned by digest (scripts/verify.d/M00.sh), and a
  # locally built one has none. Compose names the builds itself; migrate, web and worker share the
  # same build context, so the second and third builds come from the layer cache.
  build:
    context: .
    dockerfile: Dockerfile
  profiles: [app]
  # An init process forwards signals and reaps children (the entrypoint execs node).
  init: true

x-app-env: &app-env
  # The roles' passwords come separately: the app connects as app_rw and app_public_ro to this
  # host and database (src/server/db), so the URL carries no credentials.
  DATABASE_URL: postgres://app@postgres:5432/wingchunroots
  DB_APP_RW_PASSWORD: ${DB_APP_RW_PASSWORD:?DB_APP_RW_PASSWORD is not set; run scripts/init-env.sh to create .env}
  DB_APP_PUBLIC_RO_PASSWORD: ${DB_APP_PUBLIC_RO_PASSWORD:?DB_APP_PUBLIC_RO_PASSWORD is not set; run scripts/init-env.sh to create .env}
  # The address in the browser: also the links in e-mail and the trusted origin of the API.
  APP_URL: ${APP_URL:-http://localhost:3000}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is not set; run scripts/init-env.sh to create .env}
  IP_HMAC_KEY: ${IP_HMAC_KEY:?IP_HMAC_KEY is not set; run scripts/init-env.sh to create .env}
  MAIL_SEAL_KEY: ${MAIL_SEAL_KEY:?MAIL_SEAL_KEY is not set; run scripts/init-env.sh to create .env}
  INTERNAL_REVALIDATE_SECRET: ${INTERNAL_REVALIDATE_SECRET:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  # Evidence in the private bucket of the SeaweedFS above (src/server/storage).
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is not set; run scripts/init-env.sh to create .env}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is not set; run scripts/init-env.sh to create .env}
  S3_BUCKET_EVIDENCE: ${S3_BUCKET_EVIDENCE:-wcr-evidence}
  S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-wcr-media}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    # postgis/postgis publishes linux/amd64 only; Apple Silicon and Windows on Arm run it
    # under emulation. SQL stays compatible with PostgreSQL 16+ and PostGIS 3.4+ (plan §3.2).
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; run scripts/init-env.sh to create .env}
      # The image loads PostGIS and its companion extensions (postgis_topology among them)
      # into POSTGRES_DB, so it stays the maintenance database `postgres`. The application
      # databases are created empty from template0 by docker/postgres/*.sql, like the test
      # database in CI and in the cloud session: migrations create the extensions they need.
      POSTGRES_DB: postgres
      # UTF-8 everywhere: pg_trgm needs a UTF-8 LC_CTYPE for Cyrillic and Chinese names.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      # Loopback only: the database is not reachable from the local network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep PGDATA in /var/lib/postgresql/18/docker, so the volume
      # is mounted on the parent directory (mounting .../data would fail on 18+).
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/20-create-dev-database.sql:/docker-entrypoint-initdb.d/20-create-dev-database.sql:ro
      - ./docker/postgres/20-create-test-database.sql:/docker-entrypoint-initdb.d/20-create-test-database.sql:ro
    shm_size: 256mb
    healthcheck:
      # TCP, not the Unix socket: the temporary server used during initdb only listens on the
      # socket, so TCP answers only after every docker-entrypoint-initdb.d script has run.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mailpit:
    # Catches every e-mail locally (plan §3.1): SMTP on 1025, web UI on http://localhost:8025.
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    # The image ships its own HEALTHCHECK (`/mailpit readyz`).

  seaweedfs:
    # S3-compatible object storage for the ObjectStore S3 driver (plan §3.1, §6.1):
    # `weed mini` runs master, volume, filer and the S3 gateway in one process.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      # SeaweedFS turns AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY into its S3 admin identity.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is not set; run scripts/init-env.sh to create .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is not set; run scripts/init-env.sh to create .env}
      # Buckets created on start-up: private evidence and public media (plan §3.3).
      S3_BUCKET: ${S3_BUCKET_EVIDENCE:-wcr-evidence},${S3_BUCKET_MEDIA:-wcr-media}
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-bootstrap:
    # Once per start of the profile, idempotent: the roles migrator, app_rw and app_public_ro with
    # the passwords of .env, the database owner and PostGIS (scripts/db-bootstrap.sql), with the
    # psql of the database image (\getenv needs psql 15+). The passwords stay in the environment.
    profiles: [app]
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["psql", "-X", "-q", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap/db-bootstrap.sql"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; run scripts/init-env.sh to create .env}
      PGDATABASE: wingchunroots
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is not set; run scripts/init-env.sh to create .env}
      DB_APP_RW_PASSWORD: ${DB_APP_RW_PASSWORD:?DB_APP_RW_PASSWORD is not set; run scripts/init-env.sh to create .env}
      DB_APP_PUBLIC_RO_PASSWORD: ${DB_APP_PUBLIC_RO_PASSWORD:?DB_APP_PUBLIC_RO_PASSWORD is not set; run scripts/init-env.sh to create .env}
    volumes:
      - ./scripts/db-bootstrap.sql:/bootstrap/db-bootstrap.sql:ro
    restart: "no"

  migrate:
    # The migrations and the pg-boss schema as migrator (plan §6.2), then it exits.
    <<: *app
    command: ["migrate"]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      # init-env.sh generates hex passwords, which a URL carries as they are.
      DATABASE_URL: postgres://migrator:${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is not set; run scripts/init-env.sh to create .env}@postgres:5432/wingchunroots
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: "no"

  web:
    # One replica (plan §7.6): rate limits and the job producer live in one process.
    <<: *app
    command: ["web"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    environment:
      <<: *app-env
      # The local archives of scripts/backup-local.sh, read-only: /admin/system shows the newest.
      BACKUP_DIR: /backups
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ./backups:/backups:ro
    healthcheck:
      # /healthz answers only {"ok":true} (200) or {"ok":false} (503).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    # E-mail, retention, search keys and lineage counters (pg-boss).
    <<: *app
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    environment:
      <<: *app-env
      # Every e-mail goes to the Mailpit above (http://localhost:8025); none leaves the machine.
      MAIL_TRANSPORT: smtp
      SMTP_URL: smtp://mailpit:1025
      # The worker asks web to drop its public cache inside the Compose network.
      INTERNAL_APP_URL: http://web:3000

volumes:
  postgres-data:
  seaweedfs-data:
