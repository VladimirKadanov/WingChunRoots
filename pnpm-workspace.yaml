# pnpm settings (plan §3.2). Every package with an install script must be listed
# in allowBuilds with an explicit true/false; the reasons are in docs/adr/0001-stack.md.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExcludePrune: true
strictDepBuilds: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
# package.json scripts use POSIX syntax (`NAME=value cmd`); the built-in shell emulator runs
# them the same way on Linux, macOS, WSL2 and, if someone runs pnpm there, PowerShell or cmd.
shellEmulator: true
# Exact versions that trustPolicy flags as a "downgrade" although they are legitimate
# maintenance releases published after a newer major gained provenance. Each entry is
# reviewed and justified in docs/adr/0001-stack.md; no ranges or name patterns.
trustPolicyExclude:
  - semver@6.3.1
# Derived from the first `pnpm install` in M00 (see docs/adr/0001-stack.md).
allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  # M10a (docs/adr/0012-evidence-and-review.md): sharp 0.35 has no install script and loads the
  # prebuilt @img/sharp-* binaries; false keeps a build from source from ever running.
  sharp: false
  ssh2: false
  unrs-resolver: false
# lighthouse 13.4.1 accepts puppeteer-core ^25.3.0; 25.13 and later pin chromium-bidi
# 157.0.8090-0, which trustPolicy rejects (published without the provenance of earlier
# releases). 25.12.0 is the newest release before that (docs/adr/0006-design-system.md).
overrides:
  lighthouse>puppeteer-core: 25.12.0
