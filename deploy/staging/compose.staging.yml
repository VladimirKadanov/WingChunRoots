# The password-protected staging server (docs/operations/staging.md, ADR 0033): an override of
# docker-compose.yml, always used together with it through deploy/staging/staging.sh:
#
#   docker compose -f docker-compose.yml -f deploy/staging/compose.staging.yml --profile app up -d
#
# What it changes:
#   - migrate, web and worker run the image built by .github/workflows/staging-image.yml (WCR_IMAGE),
#     never a build on the server (a Next.js build needs more memory than the server has spare);
#   - Caddy in front of web and Mailpit: HTTPS (Let's Encrypt), one shared password for everything
#     except /healthz, noindex on every answer; web trusts only Caddy's address (TRUSTED_PROXIES);
#   - the erasure ledger is written to a writable folder beside the archives (web mounts the
#     archive folder read-only), so account erasures work and the ledger is backed up with them;
#   - WCR_DEMO_SIGN_IN reaches web, so the demo accounts can sign in while the demo data is loaded.
#
# Every port except Caddy's 80 and 443 stays on 127.0.0.1, as in docker-compose.yml.

x-staging-image: &staging-image
  image: ${WCR_IMAGE:?WCR_IMAGE is not set; deploy with deploy/staging/staging.sh deploy}
  pull_policy: missing

services:
  migrate:
    <<: *staging-image

  web:
    <<: *staging-image
    environment:
      TRUSTED_PROXIES: 172.31.240.10
      ERASURE_LEDGER_DIR: /erasures
      WCR_DEMO_SIGN_IN: ${WCR_DEMO_SIGN_IN:-}
      # Review 2026-11-13: the nightly archive (02:30) must be at most 36 hours old for /healthz/deep.
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-36}
    volumes:
      - type: bind
        source: ${BACKUP_DIR:-./backups}/erasures
        target: /erasures
        bind:
          create_host_path: true

  worker:
    <<: *staging-image
    environment:
      TRUSTED_PROXIES: 172.31.240.10
      ERASURE_LEDGER_DIR: /erasures
    volumes:
      - type: bind
        source: ${BACKUP_DIR:-./backups}/erasures
        target: /erasures
        bind:
          create_host_path: true

  caddy:
    image: caddy:2.11.8@sha256:4fcafa98afd1c2e642e353e3c5cf9ddbe892fcee14bc990e7ba2c5b78e51f9cf
    profiles: [app]
    restart: unless-stopped
    depends_on:
      - web
      - mailpit
    environment:
      STAGING_HOST: ${STAGING_HOST:?STAGING_HOST is not set; run deploy/staging/staging.sh init}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      # The password snippet staging.sh writes (git-ignored): a bcrypt hash, never the password.
      - ./.staging/auth.caddy:/etc/caddy/auth.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        ipv4_address: 172.31.240.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.240.0/24

volumes:
  caddy-data:
  caddy-config:
